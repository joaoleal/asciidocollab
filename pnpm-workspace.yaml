packages:
  - "packages/*"
  - "apps/*"
overrides:
  # Force the patched esbuild (GHSA-gv7w-rqvm-qjhr); only pulled transitively via tsx.
  esbuild@<0.28.1: ">=0.28.1"
  # Force patched brace-expansion (ReDoS, GHSA-3jxr-9vmj-r5cp); pulled transitively via jest and
  # eslint, all through minimatch. Each MAJOR must stay on its own line: the majors are NOT API
  # compatible (v1 exports the expand function as module.exports; v2+ do not), and minimatch 3.x still
  # requests ^1.1.7 — an unversioned `brace-expansion: ">=5.0.7"` drags it to v5 and breaks it with
  # `TypeError: expand is not a function` (eslint config-array resolution dies on it). The selector is
  # the advisory's vulnerable range and the target is the exact patched version for that major, so each
  # consumer is patched in place without a cross-major bump.
  brace-expansion@<1.1.16: 1.1.16
  brace-expansion@>=2.0.0 <2.1.2: 2.1.2
  brace-expansion@>=3.0.0 <5.0.7: 5.0.7
  # Transitive high-severity advisories with no clean parent-bump path — force the patched version.
  # Each stays within its installed major (safe) except @fastify/static (see below). Selector = the
  # advisory's vulnerable range, target = the real patched version on the registry.
  sharp@<0.35.0: ">=0.35.0"           # GHSA-f88m-g3jw-g9cj (transitive)
  postcss@<8.5.18: ">=8.5.18"         # GHSA-6g55-p6wh-862q + GHSA-r28c-9q8g-f849 (transitive 8.4.x/8.5.x)
  fast-uri@>=3.0.0 <3.1.4: ">=3.1.4 <4"  # GHSA-v2hh-gcrm-f6hx (fastify); <4 to stay within the major
  find-my-way@>=9.0.0 <9.7.0: ">=9.7.0 <10"  # GHSA-c96f-x56v-gq3h; advisory names 9.6.1 but the
                                             # registry only has 9.7.0 as the patched 9.x release
  # @fastify/static: patched only at 10.x while @fastify/swagger-ui (its sole consumer here) still
  # requests ^9 even at its latest — no parent-bump path exists, so this is a forced major override.
  # Verified against the API integration suite (which exercises the swagger /docs route).
  '@fastify/static@<10.1.1': ">=10.1.1 <11"  # GHSA-83w8-p2f5-377r
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  cpu-features: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  re2: true
  sharp: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - nodemailer@9.0.1
  - '@hocuspocus/common@4.1.1'
  - '@hocuspocus/server@4.1.1'
  - '@hocuspocus/provider@4.1.1'
