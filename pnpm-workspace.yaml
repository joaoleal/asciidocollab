packages:
  - "packages/*"
  - "apps/*"
# No `overrides:` block. Every entry that used to live here was removed once its parent caught up —
# the last one, @fastify/static, went when @fastify/swagger-ui 6 started requesting ^10.1.0 itself.
#
# Think twice before adding one back. An override pins the tree down: a later advisory against the
# pinned version cannot be resolved by `pnpm update`, so the override has to be hand-raised every
# time, and it is easy to miss. Prefer bumping the parent that declares the vulnerable range.
#
# If you do add one, re-check it periodically — parents catch up and the entry becomes dead weight
# without ever announcing it. To test whether an override is still load-bearing, delete the entry AND
# the package's stanzas from pnpm-lock.yaml, then reinstall. Dropping the entry alone proves nothing:
# pnpm keeps an existing satisfying resolution rather than re-deriving it from the parents' ranges.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  cpu-features: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  re2: true
  sharp: true
  ssh2: true
  unrs-resolver: true
