name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch when a new push arrives — but only for pull requests.
# On main every push keeps its own run: that commit's CI result is the record of whether the commit
# is releasable, and cancelling it leaves a merged commit with no verdict. A cancelled run can also
# abort a cache save mid-write (pdf-wasm's ~15-25 min CRuby compile), making the next run redo it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for the GITHUB_TOKEN across every job (CWE-275). Jobs that
# need more must opt in explicitly with their own `permissions:` block.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Fast feedback: lint, type-check, architecture guard ────────────────────
  quality:
    name: Quality (lint · types · architecture)
    runs-on: ubuntu-latest

    # The migration drift check (scripts/ci/check-migrations.sh) replays
    # prisma/migrations into a shadow database and compares it to schema.prisma,
    # so this job needs PostgreSQL. The check is strict under CI — it must never
    # silently skip, or a schema change with no migration would reach production.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: asciidocollab
          POSTGRES_PASSWORD: asciidocollab
          POSTGRES_DB: asciidocollab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asciidocollab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          # Don't leave the checkout token in .git/config where an uploaded artifact could leak it.
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SINGLE SOURCE OF TRUTH: the exact same script `pnpm gate` runs locally (scripts/ci/gate.sh →
      # quality.sh). Inlining these steps here previously let CI and the local gate drift (e.g. a
      # type-check target present in one but not the other). Keep this a thin wrapper so a green local
      # gate always means a green CI Quality job.
      - name: Quality gate (build · lint · types · architecture · audit · dead-code)
        run: bash scripts/ci/quality.sh

  # ── Domain unit tests with coverage ────────────────────────────────────────
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v5
        with:
          # Don't leave the checkout token in .git/config where an uploaded artifact could leak it.
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SINGLE SOURCE OF TRUTH: identical to the local `pnpm gate` (scripts/ci/gate.sh → unit.sh),
      # which runs coverage for EVERY package. Inlining per-package steps here let a package (e.g.
      # asciidoc-core) be enforced in CI but missing from the local gate, so a coverage regression
      # passed `pnpm gate` and only failed in CI. The script now owns the package list for both.
      - name: Unit tests + coverage (every package)
        run: bash scripts/ci/unit.sh

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            packages/asciidoc-core/coverage/
            packages/shared/coverage/
            packages/domain/coverage/
            apps/api/coverage/
            apps/collab/coverage/
            apps/web/coverage/
          retention-days: 7

  # ── Infrastructure integration tests (testcontainers manages its own DB) ───
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v5
        with:
          # Don't leave the checkout token in .git/config where an uploaded artifact could leak it.
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SINGLE SOURCE OF TRUTH: identical to the local `pnpm gate` (scripts/ci/gate.sh →
      # integration.sh). The script builds and runs the infra suite with Testcontainers' Ryuk
      # reaper disabled (as CI needs).
      - name: Integration tests (Testcontainers)
        run: bash scripts/ci/integration.sh

  # ── End-to-end tests (full stack) ──────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # Also `needs` pdf-wasm so — when it runs (a wasm-input change) — its freshly built engine is ready
    # to download here and the live-PDF specs run for real. pdf-wasm is conditional, so the `if` below
    # keeps e2e running (via always()) whether pdf-wasm succeeded, was skipped, or failed.
    needs: [unit, integration, pdf-wasm]
    if: ${{ always() && needs.unit.result == 'success' && needs.integration.result == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Don't leave the checkout token in .git/config where an uploaded artifact could leak it.
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Make the Asciidoctor-PDF wasm engine available so the live-PDF specs (pdf-preview-responsive,
      # pdf-image-embed) run for real instead of test.skip'ing. The web prebuild copies
      # ruby/asciidoctor-pdf.wasm into public/vendor/ when present. Two sources, in order of freshness:
      #   1. this run's pdf-wasm artifact, when a wasm-input change rebuilt the engine;
      #   2. otherwise the cache pdf-wasm populated on an earlier build (same gem closure).
      # If neither exists yet (cold cache, no wasm change), the specs skip exactly as before — no fail.
      - name: Download the PDF wasm engine (when pdf-wasm built it this run)
        if: needs.pdf-wasm.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: asciidoctor-pdf-wasm
          path: packages/asciidoc-pdf/ruby/

      # Only when pdf-wasm was SKIPPED (no wasm-input change) — deliberately NOT on 'failure': if the
      # build failed we must not run the live-PDF specs against a stale cached engine (a green e2e
      # would mask the broken build). On failure this step is skipped, the engine is absent, and the
      # specs skip exactly as they do on a cold cache.
      - name: Restore the PDF wasm engine from cache (when pdf-wasm was skipped)
        if: needs.pdf-wasm.result == 'skipped'
        uses: actions/cache/restore@v6
        with:
          path: packages/asciidoc-pdf/ruby/asciidoctor-pdf.wasm
          key: pdf-engine-${{ runner.os }}-${{ hashFiles('packages/asciidoc-pdf/ruby/Gemfile', 'packages/asciidoc-pdf/ruby/Gemfile.lock', 'packages/asciidoc-pdf/ruby/build-wasm.sh', 'scripts/ci/wasm.sh') }}

      - name: Build shared packages (Prisma client + declaration files)
        run: pnpm --filter '!@asciidocollab/web' -r build

      - name: Install Playwright browsers
        run: pnpm --filter @asciidocollab/web exec playwright install --with-deps chromium

      # The live-PDF specs inspect the exported PDF via poppler's CLI: pdf-image-embed reads its text
      # with `pdftotext`. Without poppler those specs error with "spawnSync pdftotext ENOENT" instead
      # of running. (The reference-parity suite has its own `pdf-parity` job — it needs no app stack,
      # so it does not run here.)
      - name: Install poppler-utils (PDF text/raster inspection for the live-PDF specs)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Start PostgreSQL and Mailpit
        run: docker compose -f docker/docker-compose.dev.yml up -d postgres mailpit --wait

      # `migrate deploy` rather than `db push --force-reset`: it applies
      # prisma/migrations/ — the exact SQL the production migrate job runs — so CI
      # exercises the real migration path. No reset is needed: the Postgres
      # service container is created fresh for every run, so the database is
      # already empty.
      - name: Apply database schema (migrations, as production does)
        run: pnpm --filter @asciidocollab/db exec prisma migrate deploy
        env:
          ASCIIDOCOLLAB_DATABASE_URL: postgresql://asciidocollab:asciidocollab@localhost:5432/asciidocollab

      - name: Start API server
        run: nohup pnpm --filter @asciidocollab/api start &
        env:
          NODE_ENV: test
          ASCIIDOCOLLAB_DATABASE_URL: postgresql://asciidocollab:asciidocollab@localhost:5432/asciidocollab
          ASCIIDOCOLLAB_API_PORT: 4000
          ASCIIDOCOLLAB_API_HOST: 0.0.0.0
          ASCIIDOCOLLAB_API_FRONTEND_URL: http://localhost:3000
          ASCIIDOCOLLAB_API_CORS_ORIGINS: http://localhost:3000
          # Internal edit endpoint the API calls to rewrite references in LIVE collab documents
          # (US12). Must match the collab server's internalEditPort below; set explicitly so the
          # round-trip never depends on two services happening to share the same default.
          ASCIIDOCOLLAB_COLLAB_EDIT_URL: http://127.0.0.1:4003
          # Shared with the collab server so its write-back is visible to GET /content.
          ASCIIDOCOLLAB_STORAGE_PATH: ${{ github.workspace }}/.e2e-storage
          ASCIIDOCOLLAB_AUTH_SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET || 'ci-test-session-secret-for-e2e-tests' }}
          # Must be a base64-encoded 32-byte string (AES-256). Value = base64("ci-test-encryption-key-32bytes!!")
          ASCIIDOCOLLAB_AUTH_SESSION_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=' }}
          ASCIIDOCOLLAB_AUTH_COOKIE_SECURE: 'false'
          ASCIIDOCOLLAB_AUTH_EMAIL_PROVIDER: smtp
          ASCIIDOCOLLAB_AUTH_EMAIL_ENABLED: 'true'
          ASCIIDOCOLLAB_AUTH_EMAIL_FROM: noreply@asciidocollab.local
          ASCIIDOCOLLAB_AUTH_SMTP_HOST: localhost
          ASCIIDOCOLLAB_AUTH_SMTP_PORT: 1025
          # Raise conservative production rate limits for CI: 12 parallel workers
          # all share the same localhost IP, so defaults are too low.
          ASCIIDOCOLLAB_ADMIN_INVITE_RATE_LIMIT_MAX: 500
          ASCIIDOCOLLAB_ADMIN_OPEN_REGISTRATION_RATE_LIMIT_MAX: 10000
          ASCIIDOCOLLAB_AUTH_EMAIL_VERIFICATION_RATE_LIMIT_MAX: 500
          ASCIIDOCOLLAB_AUTH_INVITATION_RATE_LIMIT_MAX: 500
          # Outline / cross-document suites set a project's main file many times; raise the 50/hour default.
          ASCIIDOCOLLAB_PROJECT_MAIN_FILE_RATE_LIMIT_MAX: 10000
          # Editor-open hits GET .../collab per document; 12 workers share one IP, so raise the 600/hour default.
          ASCIIDOCOLLAB_PROJECT_FILE_CONTENT_RATE_LIMIT_MAX: 10000
          # The project-settings suite reads render-config and the PDF-extension catalogue/sources on
          # every section; at 120/120/240 per hour across 12 shared-IP workers those 429, the settings
          # page then renders empty, and the reads look like save bugs (e.g. resolved-theme missing).
          # Matches the overrides already in scripts/ci/e2e-local.sh (which is why local e2e passed).
          ASCIIDOCOLLAB_PROJECT_RENDER_CONFIG_RATE_LIMIT_MAX: 10000
          ASCIIDOCOLLAB_PROJECT_PDF_EXTENSIONS_RATE_LIMIT_MAX: 10000
          ASCIIDOCOLLAB_PROJECT_PDF_EXTENSIONS_SOURCE_RATE_LIMIT_MAX: 10000

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          until curl -sf http://localhost:4000/health; do sleep 1; done
          echo "API is ready."

      # Regression guard: the collab server must REFUSE to start when its storage root
      # differs from the API's (the dev.sh data-loss bug). The API above uses
      # .e2e-storage; this starts collab with a throwaway root and asserts it fails fast.
      - name: Assert storage-consistency guard (collab refuses divergent storage)
        run: bash scripts/system-tests/assert-storage-guard.sh
        env:
          ASCIIDOCOLLAB_DATABASE_URL: postgresql://asciidocollab:asciidocollab@localhost:5432/asciidocollab
          ASCIIDOCOLLAB_COLLAB_API_INTERNAL_URL: http://127.0.0.1:4001

      - name: Start collaboration server
        run: nohup pnpm --filter @asciidocollab/collab start &
        env:
          ASCIIDOCOLLAB_DATABASE_URL: postgresql://asciidocollab:asciidocollab@localhost:5432/asciidocollab
          ASCIIDOCOLLAB_COLLAB_PORT: 4002
          ASCIIDOCOLLAB_COLLAB_API_INTERNAL_URL: http://127.0.0.1:4001
          # Internal edit server the API reaches at ASCIIDOCOLLAB_COLLAB_EDIT_URL above (US12).
          ASCIIDOCOLLAB_COLLAB_INTERNAL_EDIT_HOST: 127.0.0.1
          ASCIIDOCOLLAB_COLLAB_INTERNAL_EDIT_PORT: 4003
          ASCIIDOCOLLAB_STORAGE_PATH: ${{ github.workspace }}/.e2e-storage
          # Empty allowlist disables the Origin check for the CI stack.
          ASCIIDOCOLLAB_COLLAB_ALLOWED_ORIGINS: ''

      - name: Wait for collab server to be ready
        run: |
          echo "Waiting for collab server..."
          until (exec 3<>/dev/tcp/127.0.0.1/4002) 2>/dev/null; do sleep 1; done
          echo "Collab server is ready."

      - name: Build Next.js
        run: pnpm --filter @asciidocollab/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_COLLAB_URL: ws://localhost:4002

      - name: Start Next.js
        run: nohup pnpm --filter @asciidocollab/web start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_COLLAB_URL: ws://localhost:4002
          INTERNAL_API_URL: http://localhost:4000

      - name: Wait for web to be ready
        run: |
          echo "Waiting for web..."
          until curl -sf http://localhost:3000; do sleep 1; done
          echo "Web is ready."

      - name: Run Playwright E2E tests
        run: pnpm --filter @asciidocollab/web e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_WEB_URL: http://localhost:3000
          NEXT_PUBLIC_COLLAB_URL: ws://localhost:4002
          MAILPIT_URL: http://localhost:8025

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          # The E2E step can fail before Playwright emits a report (e.g. stack bring-up fails); with
          # `if: always()` the upload still runs, so don't warn when there is genuinely nothing.
          if-no-files-found: ignore

  # ── PDF reference parity (fidelity oracle) ─────────────────────────────────
  # Compares the PDFs our in-browser pipeline produces against committed reference PDFs built by the
  # canonical Asciidoctor-PDF toolchain. Needs NO app stack and NO database — the suite drives the wasm
  # engine and the rendering shims directly — so it runs in parallel with e2e rather than inside it.
  #
  # The engine is always available by construction: pdf-wasm rebuilds it whenever the inputs changed OR
  # the cached engine was evicted (see the probe in `changes`), so one of the two restore paths below
  # always produces it. That invariant is what this job's value rests on — without an engine the suite
  # skips every comparison and reports a green run that verified nothing, the exact failure mode this
  # job exists to prevent. So a missing engine here is treated as a hard failure, never a benign skip:
  # it can only mean pdf-wasm failed or was cancelled. scripts/ci/pdf-parity.sh fails hard too.
  pdf-parity:
    name: PDF reference parity
    runs-on: ubuntu-latest
    needs: [unit, pdf-wasm]
    if: ${{ always() && needs.unit.result == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same two sources, same precedence, as the e2e job — see the comments there.
      - name: Download the PDF wasm engine (when pdf-wasm built it this run)
        if: needs.pdf-wasm.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: asciidoctor-pdf-wasm
          path: packages/asciidoc-pdf/ruby/

      - name: Restore the PDF wasm engine from cache (when pdf-wasm was skipped)
        if: needs.pdf-wasm.result == 'skipped'
        uses: actions/cache/restore@v6
        with:
          path: packages/asciidoc-pdf/ruby/asciidoctor-pdf.wasm
          key: pdf-engine-${{ runner.os }}-${{ hashFiles('packages/asciidoc-pdf/ruby/Gemfile', 'packages/asciidoc-pdf/ruby/Gemfile.lock', 'packages/asciidoc-pdf/ruby/build-wasm.sh', 'scripts/ci/wasm.sh') }}

      # The comparison reads page counts, text layers and rasterized ink through poppler's CLI.
      - name: Install poppler-utils (PDF text/raster inspection)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # The math/diagram fixtures drive the DOM-bound mermaid + MathJax shims in a real browser page.
      - name: Install Playwright browsers
        run: pnpm --filter @asciidocollab/web exec playwright install --with-deps chromium

      # FAIL, do not skip. `changes` guarantees pdf-wasm runs whenever no cached engine survives, so
      # reaching this point without an engine means the build failed or was cancelled — a real defect,
      # not a cold cache. Skipping here instead would report a green "PDF reference parity" job that
      # compared zero PDFs, which is worse than no job at all: it looks like coverage and is not.
      - name: Check the wasm engine is present
        run: |
          set -euo pipefail
          if [ ! -f packages/asciidoc-pdf/ruby/asciidoctor-pdf.wasm ]; then
            echo "::error::No wasm engine available, so nothing can be compared against the reference PDFs."
            echo "The engine is built by the 'pdf-wasm' job (result: ${{ needs.pdf-wasm.result }}) and"
            echo "restored here from its artifact or cache. Check that job — this is not a cold cache."
            exit 1
          fi

      - name: Run the PDF reference-parity suite
        run: ./scripts/ci/pdf-parity.sh

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-pdf-parity
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── Detect whether the wasm engine inputs changed ──────────────────────────
  # The CRuby→wasm compile below is heavy (~15-25 min), so it must NOT run on every push/PR. This
  # job reports whether the pinned gem closure or the build script changed; pdf-wasm is gated on it.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block REPLACES the workflow default, so contents:read must be
      # restated here or actions/checkout loses repo-read access (breaks if the repo goes private).
      contents: read
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
      engine-cached: ${{ steps.engine-cache.outputs.cache-hit }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history so the diff below can reach the base commit on both PR (base..head) and
          # PUSH (before..after) events — main is pushed to directly. With a shallow clone the base
          # commit is unreachable and we fail safe to "changed", running the heavy wasm build anyway.
          fetch-depth: 0

      # Native path filter (no third-party action): diff the wasm inputs against the event's base.
      - name: Detect changed wasm inputs
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Missing/zero/unreachable base (first push of a branch, force-push, shallow clone) → fail
          # safe: assume the inputs changed so the engine is always rebuilt when we can't be sure.
          if [ -z "${BASE_SHA:-}" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "base commit unavailable — assuming wasm inputs changed"
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A directory pathspec matches every file under it recursively. If the diff itself errors
          # (unexpected repo state the base-reachability check above didn't catch), fail safe to
          # "changed" rather than letting `set -e` abort the step and silently skip the build.
          if ! changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            packages/asciidoc-pdf/ruby scripts/ci/wasm.sh)"; then
            echo "git diff failed — assuming wasm inputs changed"
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$changed" ]; then
            echo "wasm inputs changed:"; echo "$changed" | sed 's/^/  /'
            echo "wasm=true" >> "$GITHUB_OUTPUT"
          else
            echo "no wasm input changes"
            echo "wasm=false" >> "$GITHUB_OUTPUT"
          fi

      # "Inputs unchanged" is NOT sufficient to skip the engine build, because the cached engine can
      # disappear on its own: GitHub evicts cache entries after 7 days idle and when the repo passes
      # its 10 GB budget. Once that happens with the inputs unchanged, pdf-wasm stays skipped, the
      # e2e/pdf-parity restore finds nothing, and the fidelity oracle verifies NOTHING on every run
      # from then on — silently, and permanently, until someone happens to touch a wasm input. So
      # probe for the entry (lookup-only: no download) and rebuild when the engine is gone, changed
      # or not. The key is identical to the one pdf-wasm saves under and the consumers restore from.
      - name: Probe the engine cache (is a built engine still available?)
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: packages/asciidoc-pdf/ruby/asciidoctor-pdf.wasm
          key: pdf-engine-${{ runner.os }}-${{ hashFiles('packages/asciidoc-pdf/ruby/Gemfile', 'packages/asciidoc-pdf/ruby/Gemfile.lock', 'packages/asciidoc-pdf/ruby/build-wasm.sh', 'scripts/ci/wasm.sh') }}

  # ── Build the client-side Asciidoctor-PDF WebAssembly engine ───────────────
  # Runs ONLY when the wasm inputs changed (see `changes`). The engine is gitignored and re-synced
  # from the pinned Gemfile.lock via the ruby.wasm toolchain (rbwasm) running directly on the runner —
  # no container. setup-ruby provides Ruby 3.3; scripts/ci/wasm.sh (the same script `pnpm wasm` runs
  # locally) installs the pinned rbwasm and builds. No node/pnpm needed.
  pdf-wasm:
    name: PDF wasm engine build
    runs-on: ubuntu-latest
    needs: [quality, changes]
    # Build when the inputs changed OR when no cached engine survives (eviction) — see the probe in
    # `changes`. The second condition is what stops a silently-empty parity suite becoming permanent.
    if: ${{ needs.changes.outputs.wasm == 'true' || needs.changes.outputs.engine-cached != 'true' }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Cache the expensive part — rbwasm's downloaded wasi-sdk + compiled CRuby (./build, ./rubies) —
      # keyed on the full set of inputs the compile is a pure function of, so a re-run that didn't
      # change any of them skips the ~15-25 min compile. (Docker named volumes couldn't do this: CI
      # runners are ephemeral.) Restore + a *gated* save (not the combined actions/cache) so a FAILED
      # or partial build never persists a corrupt ./build under the key — a poisoned cache would
      # otherwise keep breaking every later run until an input changed to bust the key.
      - name: Restore the CRuby→wasm build cache (wasi-sdk + compiled CRuby)
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            packages/asciidoc-pdf/ruby/build
            packages/asciidoc-pdf/ruby/rubies
          key: rbwasm-${{ runner.os }}-${{ hashFiles('packages/asciidoc-pdf/ruby/Gemfile', 'packages/asciidoc-pdf/ruby/Gemfile.lock', 'packages/asciidoc-pdf/ruby/build-wasm.sh', 'scripts/ci/wasm.sh') }}

      - name: Build asciidoctor-pdf.wasm (ruby.wasm toolchain)
        run: bash scripts/ci/wasm.sh

      # Save only after a SUCCESSFUL build and only when the restore missed — never persist a partial
      # compile tree, and don't re-save an identical key.
      - name: Save the CRuby→wasm build cache
        if: ${{ success() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            packages/asciidoc-pdf/ruby/build
            packages/asciidoc-pdf/ruby/rubies
          key: rbwasm-${{ runner.os }}-${{ hashFiles('packages/asciidoc-pdf/ruby/Gemfile', 'packages/asciidoc-pdf/ruby/Gemfile.lock', 'packages/asciidoc-pdf/ruby/build-wasm.sh', 'scripts/ci/wasm.sh') }}

      - name: Upload wasm engine artifact
        uses: actions/upload-artifact@v7
        with:
          name: asciidoctor-pdf-wasm
          path: packages/asciidoc-pdf/ruby/asciidoctor-pdf.wasm
          retention-days: 7

      # Persist the engine under a stable cache so the e2e job can restore it on runs where pdf-wasm
      # itself doesn't run (no wasm-input change). Runs only on success (a failed build skips this
      # step), so a broken engine is never cached. The key covers EVERY input the engine is a pure
      # function of — matching the e2e restore key — so a restored engine is never stale.
      - name: Cache the built engine for the e2e job
        uses: actions/cache/save@v6
        with:
          path: packages/asciidoc-pdf/ruby/asciidoctor-pdf.wasm
          key: pdf-engine-${{ runner.os }}-${{ hashFiles('packages/asciidoc-pdf/ruby/Gemfile', 'packages/asciidoc-pdf/ruby/Gemfile.lock', 'packages/asciidoc-pdf/ruby/build-wasm.sh', 'scripts/ci/wasm.sh') }}

  # ── Production image build ─────────────────────────────────────────────────
  # docker/Dockerfile builds the four runtime images the production stack ships, from a context that
  # is the whole repository — so almost any source change can break it, while nothing else in CI
  # compiles it. Without this job a broken Dockerfile is found at deploy time, on the machine least
  # convenient to debug it on.
  #
  # SCOPE, so a green tick is not over-read: this proves the images BUILD. It does not run them, so it
  # says nothing about whether a service starts, connects, or serves. The e2e job covers runtime
  # behaviour, but against the dev stack rather than these images.
  docker:
    name: Docker images (production targets)
    runs-on: ubuntu-latest
    # After quality so a branch that cannot lint or type-check does not spend ~10 minutes here first.
    needs: quality

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # v4+ runs on the node24 runtime; v3 targeted node20, which the runner now force-upgrades and
      # warns about as deprecated. We pass no inputs and read no outputs, so v4's removal of the
      # deprecated ones cannot affect this step.
      - uses: docker/setup-buildx-action@v4

      # SINGLE SOURCE OF TRUTH: the same script the local gate runs (scripts/ci/gate.sh → docker.sh),
      # which owns the target list and the build flags. Only the cross-run layer cache is passed in
      # here, because it is CI-specific — locally the Docker daemon's own build cache already does it.
      #
      # Cache `mode=min` (final layers only), NOT max: the GitHub cache is a single 10 GB per-repo
      # budget shared with pdf-wasm's rbwasm build cache and the built engine. Exporting every
      # intermediate layer could evict those, and an evicted engine now triggers a fresh 15-25 minute
      # CRuby compile (see the `changes` probe). One scope for all four targets is deliberate — they
      # share the base/toolchain/manifests/deps stages, so a shared scope is a cache hit, not a clash.
      - name: Build every production image target
        run: |
          bash scripts/ci/docker.sh \
            --cache-from type=gha,scope=docker-prod \
            --cache-to type=gha,scope=docker-prod,mode=min

  # ── Security scanning: SAST · secrets · dependency CVEs · workflow hardening ─
  security:
    name: Security scan (SAST · secrets · deps · workflows)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # full history for secret scanning
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Semgrep and zizmor
        run: pip install --upgrade semgrep zizmor

      # Registry packs + first-party rules in .semgrep.yml (path excludes in .semgrepignore). Same
      # command as the `pnpm semgrep` script so local runs reproduce CI exactly.
      - name: Semgrep (SAST — path traversal, weak crypto, sanitization, …)
        run: semgrep --config p/security-audit --config p/owasp-top-ten --config .semgrep.yml --error --quiet .

      - name: zizmor (GitHub Actions workflow hardening)
        run: zizmor .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}

      # Resolve the latest tag with `gh` (pre-installed, authenticated via GH_TOKEN) rather than an
      # unauthenticated `curl | grep`, which silently returns exit 1 under `bash -e` when the GitHub
      # API rate-limits the shared runner IP (the response has no `tag_name` to match).
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GL=$(gh release view --repo gitleaks/gitleaks --json tagName -q .tagName)
          GL=${GL#v}
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks

      - name: gitleaks (secret scan across full history)
        run: gitleaks git --redact --verbose

      - name: Install OSV-Scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OSV=$(gh release view --repo google/osv-scanner --json tagName -q .tagName)
          OSV=${OSV#v}
          curl -fsSL -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      # Broader dependency-CVE coverage than `pnpm audit`. Gated at High+ (CVSS ≥ 7.0) to match the
      # repo's existing `pnpm audit --audit-level=high` policy; medium/low transitive advisories are
      # reported but non-blocking.
      - name: OSV-Scanner (dependency CVEs, gate at High+)
        run: |
          set -euo pipefail

          # `|| true` is required — osv-scanner exits non-zero when it FINDS advisories, which is not
          # an error here; the gate below decides. But it also exits non-zero on a genuine failure
          # (network, unreadable lockfile), and that would leave an empty osv.json that the old jq
          # expression read as "zero advisories" — a scanner that never ran reporting a clean bill of
          # health. So the output is validated before any conclusion is drawn from it.
          osv-scanner scan --lockfile=pnpm-lock.yaml --format=json > osv.json || true
          osv-scanner scan --lockfile=pnpm-lock.yaml || true   # human-readable table in the log

          if [ ! -s osv.json ] || ! jq -e 'type == "object"' osv.json >/dev/null 2>&1; then
            echo "::error::OSV-Scanner produced no parsable JSON — treating this as a scan failure."
            echo "An empty or malformed report must never be read as 'no vulnerabilities found'."
            exit 1
          fi

          # `.results` is ABSENT (not empty) when nothing was scanned, so every level is indexed with
          # `?` to yield nothing rather than error. Severities are strings and some advisory groups
          # carry a CVSS vector rather than a base score, so `tonumber` is applied only to values that
          # actually look numeric — an unguarded `tonumber` aborts the whole expression on the first
          # vector string, which under `set -e` fails the step with no indication of why.
          SEVERITIES='[ .results[]?.packages[]?.groups[]?.max_severity? // empty | select(. != "") ]'
          NUMERIC='test("^[0-9]+(\\.[0-9]+)?$")'

          HIGH=$(jq "$SEVERITIES | map(select($NUMERIC) | tonumber) | map(select(. >= 7.0)) | length" osv.json)
          echo "High+ (CVSS >= 7.0) advisories: $HIGH"

          # Anything skipped by the numeric filter is reported rather than silently dropped: a
          # non-numeric severity may well be a High, and a quiet omission would hide it.
          UNGATED=$(jq "$SEVERITIES | map(select($NUMERIC | not)) | length" osv.json)
          if [ "$UNGATED" -gt 0 ]; then
            echo "::warning::$UNGATED advisory group(s) report a non-numeric max_severity and could"
            echo "not be gated automatically — review them in the table above."
          fi

          test "$HIGH" -eq 0
