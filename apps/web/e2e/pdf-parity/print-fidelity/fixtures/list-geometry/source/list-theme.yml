# Nothing here is the renderer's own default, so a number the preview happens to agree with is an
# agreement about the theme rather than a coincidence of two defaults. The two rhythms are set apart
# on purpose: `prose` and `block` differ by 6pt, which is what makes the "a paragraph before a
# section takes the BLOCK margin" rule visible at all.
extends: default
base:
  font-size: 11
  line-height: 1.4
  text-align: justify
prose:
  margin-bottom: 9
block:
  margin-bottom: 15
heading:
  margin-top: 17
  margin-bottom: 7
list:
  indent: 21
  item-spacing: 8
  marker:
    font-color: '8B0000'
conum:
  font-size: 12
  line-height: 1.5
footnotes:
  font-size: 8
